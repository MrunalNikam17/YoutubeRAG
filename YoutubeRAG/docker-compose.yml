services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      API_KEY: ${API_KEY:-}
      DATA_DIR: /app/data
      TRANSCRIPT_CACHE_DIR: /app/data/transcripts
      VECTORSTORE_DIR: /app/data/vectorstores
      CHAT_HISTORY_DB_PATH: /app/data/chat_history.sqlite3
    volumes:
      - ./data:/app/data
